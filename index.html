<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Japan Trip Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a pocket guide. Sticky header with a scrolling date strip; each day is a timeline, then tonight's stay. Region colour tints the day. */
:root{
  --paper:#f5f6f3; --card:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#dde0e4;
  --accent:#2c3e75;           /* ai-iro indigo */
  --narita:#4f6077; --hokkaido:#2f6b4f; --kyoto:#b0372c; --nikko:#a8761a; --tokyo:#2c3e75;
  --ok:#2f6b4f; --plan:#4f6077; --flex:#7a6a9a; --todo:#b0372c;
  --tint:color-mix(in srgb,var(--region) 9%,var(--card));
  --region:var(--accent);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151c; --card:#1b1f29; --ink:#e7e9ee; --muted:#9aa1b2; --line:#2c3240;
  --accent:#8fa3e0; --narita:#9aabc4; --hokkaido:#6fb892; --kyoto:#e8796d; --nikko:#e0ad4f; --tokyo:#8fa3e0;
  --ok:#6fb892; --plan:#9aabc4; --flex:#b5a6d6; --todo:#e8796d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#12151c; --card:#1b1f29; --ink:#e7e9ee; --muted:#9aa1b2; --line:#2c3240;
  --accent:#8fa3e0; --narita:#9aabc4; --hokkaido:#6fb892; --kyoto:#e8796d; --nikko:#e0ad4f; --tokyo:#8fa3e0;
  --ok:#6fb892; --plan:#9aabc4; --flex:#b5a6d6; --todo:#e8796d; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--region)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:600;font-size:.85rem;margin-left:6px}
.clock{font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--ink);font-weight:700}

.tabs{display:flex;gap:4px;padding-block:4px 8px}
.tabs button{flex:1;min-width:0;font:inherit;font-size:.8rem;font-weight:500;padding:7px 0;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.strip{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;width:48px;padding:5px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;display:grid;justify-items:center;line-height:1.15;position:relative}
.chip .dw{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip .dn{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip .bar{width:18px;height:3px;border-radius:2px;background:var(--c);margin-top:3px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--card)}
.chip[aria-pressed="true"] .dw{color:inherit;opacity:.85}
.chip[aria-pressed="true"] .bar{background:var(--card)}
.chip.today::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--todo);border:2px solid var(--paper)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:16px 48px}
.banner{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.banner b{color:var(--ink)}

.dayhead{display:grid;gap:4px;margin-bottom:14px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--region);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow .n{color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
.meta{font-size:.85rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.intro{margin:6px 0 0;color:var(--ink)}

.sec{margin-top:22px}
.sec h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}

.tl{list-style:none;margin:0;padding:0;border-left:2px solid color-mix(in srgb,var(--region) 35%,var(--line));margin-left:6px}
.tl li{position:relative;padding:0 0 14px 18px;display:grid;gap:2px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--region)}
.tl .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.tl .what{min-width:0}
.tl .what a{font-size:.85rem;white-space:nowrap}
.pill{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.plan{color:var(--plan)} .pill.flex{color:var(--flex)} .pill.todo{color:var(--todo);background:color-mix(in srgb,var(--todo) 10%,transparent)}

.note{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--region);margin-bottom:2px}

.stay{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.stay .nm{font-weight:700;font-size:1.02rem;line-height:1.3}
.stay .jp{color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--region);border-color:var(--region);color:var(--card)}
.btn svg{width:15px;height:15px;flex:none}

details.facts{border-top:1px solid var(--line);padding-top:10px}
details.facts summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--region);list-style:none}
details.facts summary::-webkit-details-marker{display:none}
details.facts summary::before{content:"＋ "}
details.facts[open] summary::before{content:"－ "}
.facts dl{margin:10px 0 0;display:grid;gap:10px}
.facts dt{font-weight:700;font-size:.85rem}
.facts dd{margin:0;font-size:.9rem;color:var(--muted)}

.leg{font-size:.8rem;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline}
.leg a{white-space:nowrap}
.routebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.routebar .small{flex:1 1 200px;min-width:0}
.lunch{display:grid;gap:8px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.lc .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lc .nm{font-weight:700;min-width:0}
.lc .h a{font-size:.82rem;white-space:nowrap}
.lc .w{font-size:.9rem}
.lc .n{font-size:.8rem;color:var(--muted)}
.veg{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;color:var(--ok);border:1px solid var(--ok);margin-left:6px;white-space:nowrap;vertical-align:2px}
.veg.full{background:var(--ok);color:var(--card)}
.secrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.secrow h2{margin:0}
.toggle{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.nextup{display:grid;gap:2px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.nextup .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.nextup .big{font-size:1.05rem;font-weight:700;line-height:1.35}
.nextup .cd{font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--region) 55%,var(--paper));font-weight:700}
.conv{display:grid;gap:8px}
.conv label{display:grid;grid-template-columns:3.2rem 1fr;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.conv label span{font-weight:700;font-size:1.1rem}
.conv input{font:inherit;font-size:1.4rem;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);width:100%;min-width:0;padding:6px 0;outline:none}
.conv label:focus-within{border-color:var(--accent)}
.qtab{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.qtab td,.qtab th{padding:6px 0;border-bottom:1px solid var(--line);text-align:right}
.qtab th{color:var(--muted);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.qtab td:first-child,.qtab th:first-child{text-align:left}
.rates{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;margin-top:8px}
.rates input{font:inherit;width:5.5rem;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cards{display:grid;gap:8px}
.cardbtn{text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;display:grid;gap:2px}
.cardbtn .jp{font-size:1.05rem;font-weight:700}
.cardbtn .en{font-size:.85rem;color:var(--muted)}
.lockcard{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;display:grid;gap:12px}
.lockcard input[type=password],.lockcard input[type=text]{font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.lockcard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tkday{scroll-margin-top:150px;margin:22px 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px}
.tk.past{opacity:.55}
.tk h3{margin:0 0 2px;font-size:1.02rem;line-height:1.35}
.tk .who{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.tk dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px;font-size:.88rem}
.tk dt{color:var(--muted)}
.tk dd{margin:0;overflow-wrap:anywhere}
.tk .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:1rem;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline dotted;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.tk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tk .note{font-size:.84rem;color:var(--muted);margin:6px 0 0;line-height:1.45}
.tkjump{display:block;width:100%;text-align:left;font:inherit;font-size:.92rem;padding:11px 14px;margin:0 0 12px;border:1px solid var(--line);border-left:4px solid var(--region);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.overlay.qr{background:#fff;color:#111;align-items:center;text-align:center}
.overlay.qr img{width:min(78vw,380px);height:auto;image-rendering:pixelated;background:#fff;padding:10px}
.overlay.qr img.wide{width:min(92vw,520px);height:auto;min-height:90px}
.overlay.qr .big{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.4rem;font-weight:700;overflow-wrap:anywhere}
.overlay.qr .en{color:#555}
.overlay{position:fixed;inset:0;z-index:30;background:var(--card);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.overlay .jp{font-size:clamp(1.7rem,8vw,2.6rem);line-height:1.5;font-weight:700;text-wrap:pretty}
.overlay .sub{white-space:pre-line;font-size:clamp(1.2rem,5.5vw,1.6rem);line-height:1.5}
.overlay .en{font-size:1rem;color:var(--muted)}
.overlay .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:26px}
.pager button{flex:1;min-width:0;text-align:left}
.pager button:last-child{text-align:right;justify-content:flex-end}

/* reference views */
.list{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.row .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:700;line-height:1.3;min-width:0}
.row .dates{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.phone{font-variant-numeric:tabular-nums;font-weight:500;user-select:all}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;padding-left:12px}
.tbl .jp{display:block;color:var(--muted);font-size:.82rem}
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sos div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sos b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--todo)}
.sos span{font-size:.75rem;color:var(--muted)}
.wxnums{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wxnums b{color:var(--ink);font-size:1rem}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
.small{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:9}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,color .15s}}
</style>
</head><body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Japan 2026<span lang="ja">日本</span></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-day" aria-selected="true" data-view="day">Days</button>
      <button role="tab" id="tab-stays" aria-selected="false" data-view="stays">Stays</button>
      <button role="tab" id="tab-weather" aria-selected="false" data-view="weather">Weather</button>
      <button role="tab" id="tab-tickets" aria-selected="false" data-view="tickets">Tickets</button>
      <button role="tab" id="tab-tools" aria-selected="false" data-view="tools">Tools</button>
      <button role="tab" id="tab-help" aria-selected="false" data-view="help">Help</button>
    </div>
    <nav class="strip" id="strip" aria-label="Pick a day"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function japanDate(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return p; // YYYY-MM-DD
}
function todayIndex(){
  const t=japanDate();
  return DAYS.findIndex(d=>`2026-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`===t);
}
function tick(){
  const f=tz=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date());
  const wd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',weekday:'short',day:'numeric',month:'short'}).format(new Date());
  $('#clock').innerHTML=`Japan <b>${f('Asia/Tokyo')}</b> · ${wd}<br>Berlin ${f('Europe/Berlin')} · Bengaluru ${f('Asia/Kolkata')}`;
}

function stayCard(id,note){
  const s=STAYS[id];
  return `<div class="stay">
    <div><div class="nm">${esc(s.name)}</div><div class="jp" lang="ja">${esc(s.jp)}</div></div>
    ${note?`<div class="small">${esc(note)}</div>`:''}
    <dl class="kv"><dt>Address</dt><dd>${esc(s.addr)}</dd><dt>Check-in</dt><dd>${esc(s.in)}</dd><dt>Check-out</dt><dd>${esc(s.out)}</dd><dt>Phone</dt><dd class="phone">${esc(s.tel)}</dd></dl>
    <div class="small">${esc(s.extra)}</div>
    <div class="actions">
      <a class="btn primary" href="${maps(s.q)}" target="_blank" rel="noopener">${PIN}Open in Maps</a>
      <a class="btn" href="${telHref(s.tel)}">${TEL}Call</a>
      <button class="btn" type="button" data-copy="${esc(s.jp)}">${COPY}Copy address for taxi</button>
    </div></div>`;
}

    <p class="intro">${esc(d.intro)}</p>
  </div>
  <section class="sec"><h2>Today's route</h2>${route}<ol class="tl">${items}</ol></section>
  ${L.length?`<section class="sec"><div class="secrow"><h2>Lunch nearby</h2><button class="toggle" type="button" id="vegtoggle" aria-pressed="${vegOnly}">Veg-friendly only</button></div><div class="lunch">${lunchHtml}</div><p class="small">Picked for where the route puts you at midday. Hours change, so check Google Maps before you go. Fish stock (dashi) hides in many dishes; "Veg options" places need the phrase from Help.</p></section>`:''}

/* ---- Next up: first timed item of today's plan that hasn't happened yet ---- */
function nowJSTmin(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).split(':');return +p[0]*60+ +p[1];}
function nextUpHtml(){
  if(tIdx<0)return '';
  const d=DAYS[tIdx], P=PLAN[key(d)];
  const now=nowJSTmin();
  const timed=P.items.map(it=>{const m=String(it[0]).match(/(\d{1,2}):(\d{2})/);return m&&!/\bBER\b|Bengaluru →/.test(it[1])?{min:+m[1]*60+ +m[2],it}:null}).filter(Boolean);
  const nx=timed.find(x=>x.min>=now);
  if(!nx){const st=d.stay?STAYS[d.stay].name:'the airport';return `<div class="nextup"><span class="lbl">Rest of today</span><span class="big">Nothing else timed. Tonight: ${esc(st)}</span></div>`;}
  const diff=nx.min-now, h=Math.floor(diff/60), m=diff%60;
  const cd=diff<1?'now':`in ${h?h+' h ':''}${m} min`;
  return `<div class="nextup"><span class="lbl">Next up · <span class="cd">${cd}</span></span><span class="big">${esc(nx.it[0])} · ${esc(nx.it[1])}</span></div>`;
}
function refreshNextUp(){const el=$('#nextup');if(el)el.innerHTML=nextUpHtml();}

function convert(from,val){
  const v=parseFloat(String(val).replace(/[^\d.]/g,''));

  const out={jpy:fmt(yen,0),eur:fmt(yen/RATE.eur,2),usd:fmt(yen/RATE.usd,2),inr:fmt(yen/RATE.inr,0)};
  ['jpy','eur','usd','inr'].forEach(c=>{if(c!==from)$('#cv-'+c).value=isFinite(yen)?out[c]:'';});
}

const TICKET_DAYS=/*TD*/["oct17", "oct18", "oct19", "oct22", "oct24", "oct26", "oct28", "oct30", "oct31", "nov1"]/*TD*/;
let TK=null,tkFocus=null,tkErr='';
const normPass=p=>p.trim().toLowerCase().replace(/[\s\-_.]+/g,'-');
async function unlockTickets(pass){
  const b=TICKETS_BLOB,u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPass(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(b.s),iterations:b.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(b.v)},k,u8(b.c));
  TK=JSON.parse(new TextDecoder().decode(pt));
}
function renderTickets(){
  document.documentElement.style.setProperty('--region','var(--accent)');
  const head=`<div class="dayhead"><div class="eyebrow">Tickets</div><h1>Bookings &amp; QR codes</h1></div>`;
  if(!TICKETS_BLOB){$('#main').innerHTML=head+'<p>No tickets are loaded in this version.</p>';return;}
  if(!TK){
    const secure=!!(window.crypto&&crypto.subtle);
    $('#main').innerHTML=head+`<form class="lockcard" id="tkform" autocomplete="off">
      <p style="margin:0">Booking numbers and QR codes are locked. Enter the family passcode.</p>
      <input id="tkpass" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Family passcode">
      <label class="row small"><input type="checkbox" id="tkremember" checked> Remember on this phone</label>
      <div class="row"><button class="btn" type="submit">Unlock</button><span class="small" id="tkmsg" role="status">${esc(tkErr)}</span></div>
      ${secure?'':'<p class="small">This browser can\'t unlock here. Open the app from the Home Screen or the https link.</p>'}
    </form>
    <p class="small" style="margin-top:14px">The numbers are stored encrypted, so the public link shows nothing without the passcode.</p>`;
    return;
  }
  const today=japanDate();
  const iso=k=>'2026-'+(k.startsWith('oct')?'10':'11')+'-'+String(+k.slice(3)).padStart(2,'0');
  const days=[...new Set(TK.map(t=>t.day))];
  $('#main').innerHTML=head+`<div class="row" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><p class="small" style="margin:0">Tap a number to copy it. Tap a QR to show it full screen.</p><button class="btn" type="button" id="tklock">Lock</button></div>`+
  days.map(k=>{const d=DAYS.find(x=>key(x)===k);const past=iso(k)<today;
    return `<h2 class="tkday" id="tk-${k}">${d?d.dow+' '+d.d+' '+(d.m===10?'Oct':'Nov')+' · '+esc(d.title):k}</h2>`+
    TK.map((t,i)=>[t,i]).filter(([t])=>t.day===k).map(([t,i])=>`<article class="tk${past?' past':''}">
      <h3>${t.icon||''} ${esc(t.title)}</h3><div class="who">${esc(t.time&&/\d/.test(t.time)?t.time+' · ':'')}${esc(t.who||'')}</div>
      <dl>${(t.rows||[]).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${/ref|no\.|number|ID|code|E-tickets/i.test(a)&&!/\s·\s/.test(b)?`<button class="ref" type="button" data-copy="${esc(b.replace(/ \(.*\)$/,''))}" data-copymsg="Copied ${esc(b.replace(/ \(.*\)$/,''))}">${esc(b)}</button>`:esc(b)}</dd>`).join('')}</dl>
      <div class="acts">${t.qr?`<button class="btn" type="button" data-qr="${i}">Show ${t.wide?'barcode':'QR code'}</button>`:''}${t.link?`<a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.linkLabel||'Open ticket')}</a>`:''}</div>
      ${t.notes?`<p class="note">${esc(t.notes)}</p>`:''}</article>`).join('');}).join('')+
  `<p class="small" style="margin-top:22px">Copied from Abhishek's booking emails on 14 Oct. The seniors' JAL booking was added from their e-ticket. Hotel confirmation numbers aren't in that inbox, so they stay in the family PDF.</p>`;
  if(tkFocus){const el=document.getElementById('tk-'+tkFocus);if(el)el.scrollIntoView({block:'start'});tkFocus=null;}
}
function showQR(t){
  const o=document.createElement('div');o.className='overlay qr';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  const ref=(t.rows||[]).find(([a])=>/ref|no\.|number|ID/i.test(a));
  o.innerHTML=`<button class="btn close" type="button" data-close>Close</button><div style="font-weight:700">${esc(t.title)}</div><img src="${t.qr}" alt="${esc(t.qrLabel||'QR code')}" class="${t.wide?'wide':''}">${ref?`<div class="big">${esc(ref[1])}</div>`:''}<div class="en">${esc(t.qrLabel||'')}<br>Turn the screen brightness up if the scanner struggles.</div>`;
  document.body.appendChild(o);o.querySelector('[data-close]').focus();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='tkform')return; e.preventDefault();
  const p=$('#tkpass').value, rem=$('#tkremember').checked; $('#tkmsg').textContent='Unlocking…';
  try{await unlockTickets(p);tkErr='';try{if(rem)localStorage.setItem('tkpass',normPass(p));}catch(err){}renderTickets();}
  catch(err){tkErr='That passcode didn\'t work.';$('#tkmsg').textContent=tkErr;}
});
(async()=>{let p=null;try{p=localStorage.getItem('tkpass')}catch(e){}
  if(p&&TICKETS_BLOB){try{await unlockTickets(p);if(view==='tickets')renderTickets();}catch(e){try{localStorage.removeItem('tkpass')}catch(_){}}}})();

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800);}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){cur=+go.dataset.go;view='day';render(true);return;}
  const tab=e.target.closest('[data-view]'); if(tab){view=tab.dataset.view;render(true);return;}
  if(e.target.closest('#vegtoggle')){vegOnly=!vegOnly;try{localStorage.setItem('vegOnly',vegOnly?'1':'0')}catch(err){};renderDay();return;}
  const tj=e.target.closest('[data-tkday]'); if(tj){tkFocus=tj.dataset.tkday;view='tickets';render(true);return;}
  if(e.target.closest('#tklock')){TK=null;try{localStorage.removeItem('tkpass')}catch(err){};renderTickets();return;}
  const qb=e.target.closest('[data-qr]'); if(qb&&TK){showQR(TK[+qb.dataset.qr]);return;}
  if(e.target.closest('[data-close]')){e.target.closest('.overlay').remove();return;}
  const cb=e.target.closest('[data-card]');if(cb){const c=CARDS[+cb.dataset.card];showCard(c[0],'',c[1]);return;}
  const hb=e.target.closest('[data-hotel]');if(hb){const h=STAYS[hb.dataset.hotel];showCard('このホテルまでお願いします。',h.jp+'\n'+h.name,'Please take us to this hotel. '+h.addr+' · Tel '+h.tel);return;}
  const cp=e.target.closest('[data-copy]'); if(cp){
    const txt=cp.dataset.copy;
    const msg=cp.dataset.copymsg||'Address copied. Show it to the driver.';
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg),()=>toast(txt));
  }
});

// start: hash deep-link (e.g. #oct24, #stays, #help), else today's Japan date, else first/last day
(function init(){
  const h=location.hash.slice(1);
  const hi=DAYS.findIndex(d=>key(d)===h);
  if(h==='stays'||h==='help'||h==='weather'||h==='tools'||h==='tickets')view=h;
  if(hi>=0)cur=hi;
  else if(tIdx>=0)cur=tIdx;
  else cur=japanDate()>'2026-11-01'?DAYS.length-1:0;
  tick();setInterval(()=>{tick();refreshNextUp();},30000);
  render(false);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
