<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Japan Trip Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a pocket guide. Sticky header with a scrolling date strip; each day is a timeline, then tonight's stay. Region colour tints the day. */
:root{
  --paper:#f5f6f3; --card:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#dde0e4;
  --accent:#2c3e75;           /* ai-iro indigo */
  --narita:#4f6077; --hokkaido:#2f6b4f; --kyoto:#b0372c; --nikko:#a8761a; --tokyo:#2c3e75;
  --ok:#2f6b4f; --plan:#4f6077; --flex:#7a6a9a; --todo:#b0372c;
  --tint:color-mix(in srgb,var(--region) 9%,var(--card));
  --region:var(--accent);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151c; --card:#1b1f29; --ink:#e7e9ee; --muted:#9aa1b2; --line:#2c3240;
  --accent:#8fa3e0; --narita:#9aabc4; --hokkaido:#6fb892; --kyoto:#e8796d; --nikko:#e0ad4f; --tokyo:#8fa3e0;
  --ok:#6fb892; --plan:#9aabc4; --flex:#b5a6d6; --todo:#e8796d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#12151c; --card:#1b1f29; --ink:#e7e9ee; --muted:#9aa1b2; --line:#2c3240;
  --accent:#8fa3e0; --narita:#9aabc4; --hokkaido:#6fb892; --kyoto:#e8796d; --nikko:#e0ad4f; --tokyo:#8fa3e0;
  --ok:#6fb892; --plan:#9aabc4; --flex:#b5a6d6; --todo:#e8796d; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--region)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:600;font-size:.85rem;margin-left:6px}
.clock{font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--ink);font-weight:700}

.tabs{display:flex;gap:4px;padding-block:4px 8px}
.tabs button{flex:1;min-width:0;font:inherit;font-size:.8rem;font-weight:500;padding:7px 0;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.strip{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;width:48px;padding:5px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;display:grid;justify-items:center;line-height:1.15;position:relative}
.chip .dw{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip .dn{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip .bar{width:18px;height:3px;border-radius:2px;background:var(--c);margin-top:3px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--card)}
.chip[aria-pressed="true"] .dw{color:inherit;opacity:.85}
.chip[aria-pressed="true"] .bar{background:var(--card)}
.chip.today::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--todo);border:2px solid var(--paper)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:16px 48px}
.banner{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.banner b{color:var(--ink)}

.dayhead{display:grid;gap:4px;margin-bottom:14px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--region);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow .n{color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
.meta{font-size:.85rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.intro{margin:6px 0 0;color:var(--ink)}

.sec{margin-top:22px}
.sec h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}

.tl{list-style:none;margin:0;padding:0;border-left:2px solid color-mix(in srgb,var(--region) 35%,var(--line));margin-left:6px}
.tl li{position:relative;padding:0 0 14px 18px;display:grid;gap:2px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--region)}
.tl .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.tl .what{min-width:0}
.tl .what a{font-size:.85rem;white-space:nowrap}
.pill{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.plan{color:var(--plan)} .pill.flex{color:var(--flex)} .pill.todo{color:var(--todo);background:color-mix(in srgb,var(--todo) 10%,transparent)}

.note{background:var(--tint);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--region);margin-bottom:2px}

.stay{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.stay .nm{font-weight:700;font-size:1.02rem;line-height:1.3}
.stay .jp{color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.85rem;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--region);border-color:var(--region);color:var(--card)}
.btn svg{width:15px;height:15px;flex:none}

details.facts{border-top:1px solid var(--line);padding-top:10px}
details.facts summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--region);list-style:none}
details.facts summary::-webkit-details-marker{display:none}
details.facts summary::before{content:"＋ "}
details.facts[open] summary::before{content:"－ "}
.facts dl{margin:10px 0 0;display:grid;gap:10px}
.facts dt{font-weight:700;font-size:.85rem}
.facts dd{margin:0;font-size:.9rem;color:var(--muted)}

.leg{font-size:.8rem;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline}
.leg a{white-space:nowrap}
.routebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.routebar .small{flex:1 1 200px;min-width:0}
.lunch{display:grid;gap:8px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.lc .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lc .nm{font-weight:700;min-width:0}
.lc .h a{font-size:.82rem;white-space:nowrap}
.lc .w{font-size:.9rem}
.lc .n{font-size:.8rem;color:var(--muted)}
.veg{font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;color:var(--ok);border:1px solid var(--ok);margin-left:6px;white-space:nowrap;vertical-align:2px}
.veg.full{background:var(--ok);color:var(--card)}
.secrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.secrow h2{margin:0}
.toggle{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.nextup{display:grid;gap:2px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.nextup .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.nextup .big{font-size:1.05rem;font-weight:700;line-height:1.35}
.nextup .cd{font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--region) 55%,var(--paper));font-weight:700}
.conv{display:grid;gap:8px}
.conv label{display:grid;grid-template-columns:3.2rem 1fr;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.conv label span{font-weight:700;font-size:1.1rem}
.conv input{font:inherit;font-size:1.4rem;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);width:100%;min-width:0;padding:6px 0;outline:none}
.conv label:focus-within{border-color:var(--accent)}
.qtab{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.qtab td,.qtab th{padding:6px 0;border-bottom:1px solid var(--line);text-align:right}
.qtab th{color:var(--muted);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.qtab td:first-child,.qtab th:first-child{text-align:left}
.rates{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;margin-top:8px}
.rates input{font:inherit;width:5.5rem;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cards{display:grid;gap:8px}
.cardbtn{text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;display:grid;gap:2px}
.cardbtn .jp{font-size:1.05rem;font-weight:700}
.cardbtn .en{font-size:.85rem;color:var(--muted)}
.cardbtn .ro{font-size:.9rem;font-style:italic;color:var(--ink)}
.overlay .ro{font-size:clamp(1.05rem,4.6vw,1.35rem);font-style:italic;margin:6px 0 4px}
.lockcard{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;display:grid;gap:12px}
.lockcard input[type=password],.lockcard input[type=text]{font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.lockcard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tkday{scroll-margin-top:150px;margin:22px 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 12px;margin-bottom:10px}
.tk.past{opacity:.55}
.tk h3{margin:0 0 2px;font-size:1.02rem;line-height:1.35}
.tk .who{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.tk dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px;font-size:.88rem}
.tk dt{color:var(--muted)}
.tk dd{margin:0;overflow-wrap:anywhere}
.tk .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:1rem;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline dotted;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.tk .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tk .note{font-size:.84rem;color:var(--muted);margin:6px 0 0;line-height:1.45}
.tkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tktile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:104px}
.tktile .ic{font-size:1.6rem;line-height:1}
.tktile b{font-size:.98rem}
.tktile span{font-size:.8rem;color:var(--muted)}
.tktile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.tkback{font:inherit;font-size:.92rem;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer}
.tkjump{display:block;width:100%;text-align:left;font:inherit;font-size:.92rem;padding:11px 14px;margin:0 0 12px;border:1px solid var(--line);border-left:4px solid var(--region);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.overlay.qr{background:#fff;color:#111;align-items:center;text-align:center}
.overlay.qr img{width:min(78vw,380px);height:auto;image-rendering:pixelated;background:#fff;padding:10px}
.overlay.qr img.wide{width:min(92vw,520px);height:auto;min-height:90px}
.overlay.qr .big{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.4rem;font-weight:700;overflow-wrap:anywhere}
.overlay.qr .en{color:#555}
.overlay{position:fixed;inset:0;z-index:30;background:var(--card);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.overlay .jp{font-size:clamp(1.7rem,8vw,2.6rem);line-height:1.5;font-weight:700;text-wrap:pretty}
.overlay .sub{white-space:pre-line;font-size:clamp(1.2rem,5.5vw,1.6rem);line-height:1.5}
.overlay .en{font-size:1rem;color:var(--muted)}
.overlay .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:26px}
.pager button{flex:1;min-width:0;text-align:left}
.pager button:last-child{text-align:right;justify-content:flex-end}

/* reference views */
.list{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.row .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:700;line-height:1.3;min-width:0}
.row .dates{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.phone{font-variant-numeric:tabular-nums;font-weight:500;user-select:all}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;padding-left:12px}
.tbl .jp{display:block;color:var(--muted);font-size:.82rem}
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sos div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sos b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--todo)}
.sos span{font-size:.75rem;color:var(--muted)}
.wxnums{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wxnums b{color:var(--ink);font-size:1rem}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.92rem}
.small{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:9}
.expform{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;display:grid;gap:10px}
.expform label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.expform input,.expform select,.expimp textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.expform .amt{display:grid;grid-template-columns:5rem 1fr;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:inherit;text-transform:none;letter-spacing:0;font-size:.85rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.exptot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exptot div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.exptot b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.explist{list-style:none;margin:0;padding:0}
.explist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.explist .am{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.explist .meta{font-size:.78rem;color:var(--muted)}
.explist .acts{grid-column:1/-1;display:flex;gap:8px}
.explist .acts button{font:inherit;font-size:.75rem;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.expimp textarea{min-height:5rem}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.85rem;margin-top:8px}
.bars .lb{color:var(--ink);white-space:nowrap}
.bars .tr{height:14px;display:flex;align-items:center}
.bars .bar{height:14px;min-width:2px;background:var(--accent);border-radius:0 4px 4px 0}
.bars .vl{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.bars .today{font-weight:700}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,color .15s}}
</style>
</head><body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Japan 2026<span lang="ja">日本</span></div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-day" aria-selected="true" data-view="day">Days</button>
      <button role="tab" id="tab-stays" aria-selected="false" data-view="stays">Stays</button>
      <button role="tab" id="tab-weather" aria-selected="false" data-view="weather">Weather</button>
      <button role="tab" id="tab-tickets" aria-selected="false" data-view="tickets">Tickets</button>
      <button role="tab" id="tab-spend" aria-selected="false" data-view="spend">Spend</button>
      <button role="tab" id="tab-tools" aria-selected="false" data-view="tools">Tools</button>
      <button role="tab" id="tab-help" aria-selected="false" data-view="help">Help</button>
    </div>
    <nav class="strip" id="strip" aria-label="Pick a day"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

const $=s=>document.querySelector(s);

function japanDate(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  return p; // YYYY-MM-DD
}
function todayIndex(){
  const t=japanDate();
  return DAYS.findIndex(d=>`2026-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`===t);
}
function tick(){
  const f=tz=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date());
  const wd=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',weekday:'short',day:'numeric',month:'short'}).format(new Date());
  $('#clock').innerHTML=`Japan <b>${f('Asia/Tokyo')}</b> · ${wd}<br>Berlin ${f('Europe/Berlin')} · Bengaluru ${f('Asia/Kolkata')}`;
}

const MORE_FACTS={"oct17": [["Narita-san Shinshoji", "A big temple near the airport, founded in 940. Its fire god Fudo Myoo is Acala, a deity who came to Japan from India with Buddhism."], ["Japan in numbers", "About 124 million people on 14,125 islands, by a 2023 government count."], ["🧒 Vending machines", "Japan has about 4 million vending machines. Some sell hot corn soup or hot tea in a can."]], "oct18": [["Senso-ji legend", "In 628 two fishermen brothers pulled a small golden Kannon statue out of the Sumida River. The temple was built to house it."], ["🧒 Omikuji fortunes", "At Senso-ji, shake the box for a numbered stick and get a paper fortune. If it says bad luck, tie it to the rack and leave the bad luck behind."], ["🧒 Ueno pandas", "Japan's first pandas came to Ueno Zoo in 1972, as a gift from China."]], "oct19": [["Ainu names", "Hokkaido is the home of the Ainu, its Indigenous people, and many place names are Ainu. Sapporo probably means \"big dry river\"; Furano comes from words for \"smelly place\", after the sulphur of the volcanoes."], ["Lake Shikotsu", "A volcanic crater lake about 360 m deep, Japan's second deepest. It is the northernmost lake in Japan that doesn't freeze."], ["Ningle Terrace", "Little wooden craft huts in the forest, named after Ningle, tiny forest people in a story by Furano writer So Kuramoto."], ["🧒 Foxes", "Look out for Ezo red foxes by the road. Don't touch or feed them: they can carry a parasite harmful to people."]], "oct20": [["Biei's famous trees", "The Ken and Mary Tree became famous from a 1972 Nissan car advert, and the Seven Stars Tree from a 1976 cigarette packet."], ["Shirahige Falls", "\"White beard\" falls: the water seeps out of the cliff face rather than flowing over the top."], ["🧒 Potato island", "Hokkaido grows about 80% of Japan's potatoes. Try them as jaga-bata, a baked potato with butter."], ["Tokachidake", "Still an active volcano. On a clear day you can see steam rising near its top."]], "oct21": [["Otaru Canal", "Finished in 1923. When the city planned to fill it in for a road in the 1970s, residents campaigned to save half of it, and the warehouses became shops and cafes."], ["Wall Street of the North", "Herring fishing and trade made Otaru rich around 1900; banks built the stone buildings you see along the old streets."], ["Steam clock", "The steam clock outside the Music Box Museum was made by Raymond Saunders, who built the famous one in Vancouver's Gastown."], ["Sapporo Snow Festival", "Began in 1950 when six high-school students built snow statues in Odori Park. Now about 2 million people come each February."], ["Sapporo TV Tower", "147 m tall, opened in 1957. Its big digital clock faces straight down Odori Park."], ["A planned city", "Sapporo was laid out from 1869 with help from American advisers, which is why its streets form a numbered grid."], ["🧒 Steam clock tune", "The Otaru steam clock whistles a tune every 15 minutes. Can you be there when it plays?"], ["Sapporo Beer", "Japan's oldest beer brand, founded in 1876."]], "oct22": [["Sinking airport", "Kansai Airport's island is slowly sinking, so the terminal stands on columns that engineers can jack up."], ["🧒 Street song", "Kyoto children learn a song to remember the east–west streets in order: \"Maru, Take, Ebisu, Ni, Oshi, Oike...\""], ["Temples everywhere", "Kyoto has about 1,600 Buddhist temples and 400 Shinto shrines. Seventeen of its sites share one UNESCO World Heritage listing."], ["Nishiki Market", "\"Kyoto's kitchen\": a 390 m covered market street that has traded for about 400 years."]], "oct23": [["Gods from India", "Many Japanese gods came from India with Buddhism: Benzaiten is Saraswati, Bishamonten is Vaishravana (Kubera), Daikokuten is Mahakala and Taishakuten is Indra."], ["Radhabinod Pal", "Up the hill from Kodaiji, Ryozen Gokoku Shrine has a memorial to Indian judge Radhabinod Pal, the one Tokyo Trials judge who dissented. Many Japanese remember him warmly."], ["Geiko and maiko", "In Kyoto, geisha are called geiko. Apprentices (maiko) wear long trailing sashes and tall wooden clogs. Don't photograph them without asking."], ["🧒 Jumping off Kiyomizu", "\"Jumping off the stage at Kiyomizu\" means taking a big plunge. In the Edo period about 230 people really jumped, and most survived."], ["Matcha", "The monk Eisai brought tea seeds and powdered tea from China around 1191. Sen no Rikyu shaped the tea ceremony in the 1500s."]], "oct24": [["🧒 Ryoan-ji puzzle", "The rock garden has 15 stones, but from any spot on the veranda you can see only 14. Count them!"], ["Ryoan-ji water basin", "Its four characters read \"ware tada taru wo shiru\": I only know contentment."], ["Boatmen's poles", "Hozugawa boatmen steer with long bamboo poles. Some rocks have grooves worn by centuries of poles."], ["🧒 Monkeys", "Iwatayama Monkey Park on the hill above Arashiyama has about 120 wild Japanese macaques."]], "oct25": [["Osaka Castle", "Built by Toyotomi Hideyoshi in 1583. Today's main tower is a 1931 concrete rebuild, with a lift inside."], ["Fushimi Inari gates", "About 10,000 torii gates, each donated by a person or business. The donor's name is written on the back."], ["🧒 Escalators", "In Osaka people stand on the right of the escalator. In Tokyo they stand on the left."], ["World Expo", "Osaka hosted the World Expo in 1970 and again in 2025."], ["🧒 Takoyaki", "Octopus balls were invented in Osaka in 1935."]], "oct26": [["🧒 Kingfisher nose", "An earlier bullet train (the 500 series) got its long nose from a kingfisher's beak, to stop a loud boom when leaving tunnels."], ["Seven-minute clean", "At Tokyo Station, cleaning crews turn a Shinkansen around in about 7 minutes."], ["🧒 Three wise monkeys", "\"See no evil, hear no evil, speak no evil\" is carved at Toshogu, on the sacred stable, because monkeys were believed to protect horses."], ["Sleeping cat", "Look for Nemuri-neko, a small carving of a sleeping cat at Toshogu, said to be by the master carver Hidari Jingoro."], ["Shinkyo Bridge", "Legend says two giant snakes formed a bridge here so the monk Shodo Shonin could cross the river and found Nikko's temples."]], "oct27": [["Lake Chuzenji", "Formed when Mt Nantai erupted and dammed a river. Foreign embassies once had summer villas here; the Italian villa is open to visit."], ["Onsen manners", "Wash fully at the showers before getting in, keep the small towel out of the water, and no swimsuits."], ["Yukata", "Wrap the left side over the right. Right over left is only for the dead."], ["🧒 Tatami", "Rooms in Japan are measured in tatami mats: a \"6-mat room\" is about 10 square metres. Tonight everyone sleeps on futons on tatami."]], "oct28": [["Edo", "Tokyo was called Edo until 1868. By around 1720 it had about a million people, among the largest cities in the world."], ["🧒 Winged kirin", "The bronze kirin on Nihombashi Bridge have wings, which kirin normally don't, to show flying off to every corner of Japan."], ["Under the motorway", "The expressway built over Nihombashi for the 1964 Olympics is being moved underground, planned to finish around 2040."]], "oct29": [["Nakamuraya curry", "Indian revolutionary Rash Behari Bose found refuge in Tokyo and in 1927 helped Nakamuraya bakery in Shinjuku launch real Indian curry. It's still on the menu."], ["Netaji in Tokyo", "Subhas Chandra Bose's ashes are kept at Renko-ji temple in Suginami, Tokyo."], ["🧒 Busiest station", "Shinjuku Station is the world's busiest, with over 3 million passengers a day before 2020."]], "oct30": [["🧒 Art that reacts", "teamLab's artworks respond to you: touch a wall and flowers bloom or scatter, and the works drift between rooms."], ["Tokyo Skytree", "634 m, the world's tallest tower. The digits 6-3-4 can be read \"mu-sa-shi\", the old name of this region."]], "oct31": [["Shibuya Sky", "The open-air roof is about 230 m up, on top of Shibuya Scramble Square, opened in 2019."], ["🧒 Hachiko reunited", "A second statue, at the University of Tokyo, shows Hachiko finally jumping up to greet his owner, Professor Ueno."], ["Halloween rules", "Shibuya bans drinking on the street around Halloween. Expect big crowds and lots of police in the evening."], ["🧒 Harajuku crêpes", "Rolled crêpes with cream and fruit arrived on Takeshita Street in the 1970s and became a Harajuku symbol."]], "nov1": [["Mata ne", "Friends rarely say \"sayonara\": it sounds final. \"Mata ne\" (see you) is the usual goodbye."], ["🧒 Bowing", "A small nod means thanks; deeper bows are for apologies. \"Arigato gozaimashita\" at the end means thank you for everything."]]};
function renderDay(){
  const d=DAYS[cur];
  document.documentElement.style.setProperty('--region',`var(--${d.region})`);
  const t=japanDate();
  let banner='';
  if(t<'2026-10-17'){
    const days=Math.round((Date.parse('2026-10-17T00:00:00+09:00')-Date.now())/864e5);
    banner=`<p class="banner"><b>${days} day${days===1?'':'s'} to go.</b> Once you're in Japan this page opens on that day automatically.</p>`;
  } else if(t>'2026-11-01'){
    banner=`<p class="banner">The trip is over. Okaeri, welcome home.</p>`;
  }
  const P=PLAN[key(d)], mode=P.mode;
  let prevQ=P.start;
  const items=P.items.map(([tm,txt,s,q,leg,md])=>{
    let legHtml='';
    if(q){
      const dir=dirLink(prevQ,q,md||mode);
      legHtml=`<div class="leg">${leg?`<span>↳ ${esc(leg)}</span>`:''}<a href="${dir}" target="_blank" rel="noopener">Directions ↗</a><a href="${maps(q)}" target="_blank" rel="noopener">Map ↗</a></div>`;
      prevQ=q;
    }
    return `<li><div class="when"><span class="t">${esc(tm)}</span><span class="pill ${s}">${sLabel[s]}</span></div><div class="what">${esc(txt)}</div>${legHtml}</li>`;
  }).join('');
  const stops=[P.start,...P.items.filter(i=>i[3]).map(i=>i[3])].filter((q,i,a)=>q!==a[i-1]);
  let route='';
  if(mode!=='transit' && stops.length>1){
    const o=stops[0], dst=stops[stops.length-1], w=stops.slice(1,-1).slice(0,9);
    const url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(dst)}${w.length?`&waypoints=${encodeURIComponent(w.join('|'))}`:''}&travelmode=${mode}`;
    route=`<div class="routebar"><a class="btn primary" href="${url}" target="_blank" rel="noopener">${PIN}Route for today</a><span class="small">Opens all ${stops.length} stops in Google Maps (Apple Maps links can't hold several stops), ${mode==='driving'?'by car':'on foot'}. Single stops below open in Apple Maps.</span></div>`;
  } else if(stops.length>1){
    route=`<div class="routebar"><span class="small">Train and subway day: tap <b>Directions</b> under each stop for that leg on public transport.</span></div>`;
  }
  const L=(LUNCH[key(d)]||[]).map((x,i)=>[x,i]).sort((a,b)=>(b[0][4]-a[0][4])||(a[1]-b[1])).map(x=>x[0]);
  const lunchHtml=L.filter(x=>!vegOnly||x[4]).map(([nm,q,w,n,v])=>`<div class="lc"><div class="h"><div class="nm">${esc(nm)}${v===2?'<span class="veg full">Vegetarian</span>':v===1?'<span class="veg">Veg options</span>':''}</div><a href="${maps(q)}" target="_blank" rel="noopener">Map ↗</a></div><div class="w">${esc(w)}</div><div class="n">${esc(n)}</div></div>`).join('');
  const prev=DAYS[cur-1], next=DAYS[cur+1];
  if(cur===tIdx)banner+=`<div id="nextup">${nextUpHtml()}</div>`;
  $('#main').innerHTML=`${banner}
  <div class="dayhead">
    <div class="eyebrow">${REG[d.region]}<span class="n">Day ${cur+1} of 16${cur===tIdx?' · today':''}</span></div>
    <h1>${esc(d.title)}</h1>
    <div class="meta"><span>${d.dow} ${d.d} ${d.m===10?'Oct':'Nov'}</span><span>Base: ${esc(d.base)}</span><a href="${live(WX[DAYWX[key(d)]].q)}" target="_blank" rel="noopener">${esc(d.wx)} · live forecast ↗</a></div>
    <p class="intro">${esc(d.intro)}</p>
  </div>
  <section class="sec"><h2>Today's route</h2>${route}<ol class="tl">${items}</ol></section>
  ${L.length?`<section class="sec"><div class="secrow"><h2>Lunch nearby</h2><button class="toggle" type="button" id="vegtoggle" aria-pressed="${vegOnly}">Veg-friendly only</button></div><div class="lunch">${lunchHtml}</div><p class="small">Picked for where the route puts you at midday. Hours change, so check opening times in Maps before you go. Fish stock (dashi) hides in many dishes; "Veg options" places need the phrase from Help.</p></section>`:''}
  <section class="sec"><div class="note"><b>${esc(d.note[0])}</b>${esc(d.note[1])}</div></section>
  <section class="sec"><h2>${d.stay?'Tonight':'Tonight'}</h2>${d.stay?stayCard(d.stay,d.stayNote):`<div class="stay"><div class="nm">Flights home</div><div class="small">Prabhakar & Anitha on JL 753 (18:25, T2). Berlin group on MS 965 (20:30). Confirm terminals on the e-tickets.</div><div class="actions"><a class="btn primary" href="${maps('成田国際空港')}" target="_blank" rel="noopener">${PIN}Narita Airport</a></div></div>`}</section>
  <section class="sec"><details class="facts"><summary>Did you know? (${d.facts.length+(MORE_FACTS[key(d)]||[]).length})</summary><dl>${d.facts.concat(MORE_FACTS[key(d)]||[]).map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl></details></section>
  <div class="pager">
    ${prev?`<button class="btn" type="button" data-go="${cur-1}">← ${prev.dow} ${prev.d}</button>`:'<span></span>'}
    ${next?`<button class="btn" type="button" data-go="${cur+1}">${next.dow} ${next.d} →</button>`:'<span></span>'}
  </div>`;
}

function nowJSTmin(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).split(':');return +p[0]*60+ +p[1];}

const RATE_DEFAULT={eur:177,usd:158.4,inr:1.66}; /* yen per €1, $1 and ₹1, mid-market on 14 Oct 2026 */
const qrow=y=>`<tr><td>¥${fmt(y,0)}</td><td>€${fmt(y/RATE.eur,2)}</td><td>$${fmt(y/RATE.usd,2)}</td><td>₹${fmt(y/RATE.inr,0)}</td></tr>`;
let RATE={...RATE_DEFAULT};
let RATE_SRC=null,rateManual=false; /* RATE_SRC: {date,src,at} of the last live rate */
try{rateManual=localStorage.getItem('rateManual')==='1';
  const r=JSON.parse(localStorage.getItem(rateManual?'rates':'ratesLive')||'null');
  if(r&&r.eur>0&&r.usd>0&&r.inr>0){RATE={eur:r.eur,usd:r.usd,inr:r.inr};if(!rateManual)RATE_SRC=r;}}catch(e){}
/* live rates: ECB via Frankfurter, else open.er-api.com; checked at most every 30 min while online */
async function fetchRates(force){
  if(rateManual&&!force)return;
  if(!force&&RATE_SRC&&Date.now()-RATE_SRC.at<30*60e3)return;
  const get=async(u,f)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw 0;return f(await r.json());}finally{clearTimeout(t);}};
  const fromEur=(j,y,u,i,d,src)=>{if(!(y>0&&u>0&&i>0))throw 0;return {eur:+y.toFixed(2),usd:+(y/u).toFixed(2),inr:+(y/i).toFixed(4),date:d,src,at:Date.now()};};
  let r=null;
  try{r=await get('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=JPY,USD,INR',j=>fromEur(j,j.rates.JPY,j.rates.USD,j.rates.INR,j.date,'the European Central Bank'));}catch(e){}
  if(!r)try{r=await get('https://open.er-api.com/v6/latest/EUR',j=>fromEur(j,j.rates.JPY,j.rates.USD,j.rates.INR,new Date(j.time_last_update_unix*1000).toISOString().slice(0,10),'ExchangeRate-API'));}catch(e){}
  if(!r){if(force)toast('No connection. Keeping the saved rate.');rateStatus();return;}
  RATE={eur:r.eur,usd:r.usd,inr:r.inr};RATE_SRC=r;rateManual=false;
  try{localStorage.setItem('ratesLive',JSON.stringify(r));localStorage.removeItem('rateManual');}catch(e){}
  if(view==='tools'){['eur','usd','inr'].forEach(c=>{const el=$('#rt-'+c);if(el&&document.activeElement!==el)el.value=RATE[c];});
    const q=$('#qtab tbody');if(q)q.innerHTML=[500,1000,3000,5000,10000,30000].map(qrow).join('');
    const j=$('#cv-jpy');if(j&&j.value)convert('jpy',j.value);}
  rateStatus();
}
function rateText(){
  const d=x=>new Date(x+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
  if(rateManual)return 'Using the rate you typed in. <button class="btn" type="button" data-ratelive style="padding:2px 8px;font-size:.75rem">Use live rate</button>';
  if(RATE_SRC)return `Live rate from ${esc(RATE_SRC.src)}, ${d(RATE_SRC.date)}, checked ${new Date(RATE_SRC.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'})} Japan time. It updates by itself when you're online. Card and ATM rates are usually 1–3% worse.`;
  return 'Saved rate from 14 Oct 2026. It updates by itself next time you open this with internet. Card and ATM rates are usually 1–3% worse.';
}

function convert(from,val){

  ['jpy','eur','usd','inr'].forEach(c=>{if(c!==from)$('#cv-'+c).value=isFinite(yen)?out[c]:'';});
}

const TICKET_DAYS=/*TD*/["oct17", "oct18", "oct19", "oct21", "oct22", "oct24", "oct26", "oct27", "oct28", "oct30", "oct31", "nov1"]/*TD*/;
let TK=null,tkFocus=null,tkErr='',tkSec=null,TKPASS=null,packURL=null;
const TK_SECS=[['fly','✈','Flights'],['bp','🎫','Boarding passes'],['vjw','🛂','Visit Japan Web','arrival QR codes'],['ins','🛡','Travel insurance'],['rail','🚆','Trains'],['car','🚗','Car hire'],['see','🎟','Sights & tours'],['stay','🏨','Stays','booking numbers and PINs']];
const normPass=p=>p.trim().toLowerCase().replace(/[\s\-_.]+/g,'-');
async function unlockTickets(pass){
  const b=TICKETS_BLOB,u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPass(pass)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(b.s),iterations:b.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(b.v)},k,u8(b.c));
  TK=JSON.parse(new TextDecoder().decode(pt));
  TKPASS=normPass(pass);
  try{const pb=PAID_BLOB,k1=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(pb.s),iterations:pb.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    PAID=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(pb.v)},k1,u8(pb.c))));}catch(e){PAID=null;}
  try{const sb=SYNC_BLOB,k2=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(sb.s),iterations:sb.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
    SYNC=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(sb.v)},k2,u8(sb.c))));}catch(e){SYNC=null;}
  if(SYNC)syncExp();
}
function renderTickets(){
  document.documentElement.style.setProperty('--region','var(--accent)');
  const head=`<div class="dayhead"><div class="eyebrow">Tickets</div><h1>Bookings &amp; QR codes</h1></div>`;
  if(!TICKETS_BLOB){$('#main').innerHTML=head+'<p>No tickets are loaded in this version.</p>';return;}
  if(!TK){
    const secure=!!(window.crypto&&crypto.subtle);
    $('#main').innerHTML=head+`<form class="lockcard" id="tkform" autocomplete="off">
      <p style="margin:0">Booking numbers and QR codes are locked. Enter the family passcode.</p>
      <input id="tkpass" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Family passcode">
      <label class="row small"><input type="checkbox" id="tkremember" checked> Remember on this phone</label>
      <div class="row"><button class="btn" type="submit">Unlock</button><span class="small" id="tkmsg" role="status">${esc(tkErr)}</span></div>
      ${secure?'':'<p class="small">This browser can\'t unlock here. Open the app from the Home Screen or the https link.</p>'}
    </form>
    <p class="small" style="margin-top:14px">The numbers are stored encrypted, so the public link shows nothing without the passcode.</p>`;
    return;
  }
  const today=japanDate();
  const iso=k=>'2026-'+(k.startsWith('oct')?'10':'11')+'-'+String(+k.slice(3)).padStart(2,'0');
  const dlabel=k=>{const d=DAYS.find(x=>key(x)===k);return d?d.dow+' '+d.d+' '+(d.m===10?'Oct':'Nov'):k;};
  const L=TK.map((t,i)=>[t,i]);
  if(tkFocus){tkSec='day:'+tkFocus;tkFocus=null;}
  const top=`<div class="row" style="display:flex;gap:10px;align-items:center;justify-content:space-between">`;
  if(!tkSec){
    $('#main').innerHTML=head+top+`<p class="small" style="margin:0">Pick a section.</p><button class="btn" type="button" id="tklock">Lock</button></div><div class="tkgrid">`+
    TK_SECS.map(([k,ic,name,sub])=>{const it=TK.filter(t=>t.sec===k);if(!it.length)return '';
      const nx=it.map(t=>iso(t.day)).filter(x=>x>=today).sort()[0];
      const nk=nx?TK.find(t=>iso(t.day)===nx).day:null;
      return `<button class="tktile" type="button" data-tksec="${k}"><span class="ic">${ic}</span><b>${esc(name)}</b><span>${it.length} item${it.length>1?'s':''}${sub?' · '+esc(sub):''}${nk?'<br>Next: '+dlabel(nk):''}</span></button>`;}).join('')+`</div>`+
    `<p class="small" style="margin-top:22px">Copied from Abhishek's booking emails and the tickets he shared. Hotel confirmation numbers aren't in that inbox, so they stay in the family PDF.</p>`;
    window.scrollTo(0,0);return;
  }
  const card=(t,i)=>`<article class="tk${iso(t.day)<today?' past':''}">
      <h3>${t.icon||''} ${esc(t.title)}</h3><div class="who">${esc(t.time&&/\d/.test(t.time)?t.time+' · ':'')}${esc(t.who||'')}</div>
      <dl>${(t.rows||[]).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${/ref|no\.|number|ID|code|E-tickets/i.test(a)&&!/\s·\s/.test(b)?`<button class="ref" type="button" data-copy="${esc(b.replace(/ \(.*\)$/,''))}" data-copymsg="Copied ${esc(b.replace(/ \(.*\)$/,''))}">${esc(b)}</button>`:esc(b)}</dd>`).join('')}</dl>
      <div class="acts">${t.qr?`<button class="btn" type="button" data-qr="${i}">Show ${t.wide?'barcode':'QR code'}</button>`:''}${t.link?`<a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.linkLabel||'Open ticket')}</a>`:''}</div>
      ${t.notes?`<p class="note">${esc(t.notes)}</p>`:''}</article>`;
  const isDay=tkSec.startsWith('day:'),dk=tkSec.slice(4),S=TK_SECS.find(x=>x[0]===tkSec);
  const items=L.filter(([t])=>isDay?t.day===dk:t.sec===tkSec);
  const grp=t=>isDay?(TK_SECS.find(x=>x[0]===t.sec)||['','',''])[2]:tkSec==='bp'?t.title.split(' · ').slice(2).join(' · ')+' · '+dlabel(t.day):dlabel(t.day)+(DAYS.find(x=>key(x)===t.day)?' · '+DAYS.find(x=>key(x)===t.day).title:'');
  const groups=[...new Set(items.map(([t])=>grp(t)))];
  $('#main').innerHTML=head+top+`<button class="tkback" type="button" data-tksec="">‹ All sections</button><button class="btn" type="button" id="tklock">Lock</button></div>`+
    `<h2 style="margin:8px 0 2px">${isDay?'🎫 '+esc(dlabel(dk)):S[1]+' '+esc(S[2])}</h2><p class="small" style="margin:0">Tap a number to copy it. Tap a QR to show it full screen.</p>`+
    groups.map(g=>`<h3 class="tkday">${esc(g)}</h3>`+items.filter(([t])=>grp(t)===g).map(([t,i])=>card(t,i)).join('')).join('')+
    `<button class="tkback" type="button" data-tksec="" style="margin-top:12px">‹ All sections</button>`;
  window.scrollTo(0,0);
}
async function openPack(save){
  const msg=$('#pkmsg');
  try{
    if(!packURL){
      if(!TKPASS)throw new Error('locked');
      msg.textContent='Opening…';
      const buf=new Uint8Array(await (await fetch('trip-pack.bin')).arrayBuffer());
      const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(TKPASS),'PBKDF2',false,['deriveKey']);
      const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(0,16),iterations:600000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
      const pdf=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(16,28)},k,buf.slice(28));
      packURL=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
    }
    const a=document.createElement('a');a.href=packURL;
    if(save)a.download='Japan_Family_Trip_2026.pdf';else a.target='_blank';
    document.body.appendChild(a);a.click();a.remove();msg.textContent='';
  }catch(err){msg.textContent=err.message==='locked'?'Unlock Tickets first.':'The PDF could not be opened here. Use the phone app (abhishekshroffberlin.github.io/japan-trip), opened once with internet.';}
}
function showQR(t){
  const o=document.createElement('div');o.className='overlay qr';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  const ref=(t.rows||[]).find(([a])=>/ref|no\.|number|ID/i.test(a));
  o.innerHTML=`<button class="btn close" type="button" data-close>Close</button><div style="font-weight:700">${esc(t.title)}</div><img src="${t.qr}" alt="${esc(t.qrLabel||'QR code')}" class="${t.wide?'wide':''}">${ref?`<div class="big">${esc(ref[1])}</div>`:''}<div class="en">${esc(t.qrLabel||'')}<br>Turn the screen brightness up if the scanner struggles.</div>`;
  document.body.appendChild(o);o.querySelector('[data-close]').focus();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='tkform')return; e.preventDefault();
  const p=$('#tkpass').value, rem=$('#tkremember').checked; $('#tkmsg').textContent='Unlocking…';
  try{await unlockTickets(p);tkErr='';try{if(rem)localStorage.setItem('tkpass',normPass(p));}catch(err){}renderTickets();}
  catch(err){tkErr='That passcode didn\'t work.';$('#tkmsg').textContent=tkErr;}
});
(async()=>{let p=null;try{p=localStorage.getItem('tkpass')}catch(e){}
  if(p&&TICKETS_BLOB){try{await unlockTickets(p);if(view==='tickets')renderTickets();}catch(e){try{localStorage.removeItem('tkpass')}catch(_){}}}})();

/* family sync: one Google Sheet (Apps Script web app); its link is in the passcode-locked SYNC_BLOB.
   Each phone sends its whole list; the sheet keeps the newest version of each entry (upd) and returns everything. */
const COLS=['id','date','by','pay','what','cat','amt','cur','yen','ts','upd','del'];
async function syncExp(){
  if(!SYNC)return;
  if(syncBusy){syncAgain=true;return;}
  syncBusy=true;syncMsg='Syncing…';syncStatus();
  try{
    const rows=EXP.map(x=>({...x,pay:x.pay||'Cash',upd:x.upd||x.ts,del:''})).concat(Object.entries(EXPDT).map(([id,t])=>({id,upd:t,del:'1'})));
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);
    const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({t:SYNC.t,rows:rows.map(x=>Object.fromEntries(COLS.map(k=>[k,x[k]==null?'':x[k]])))}),signal:c.signal});
    clearTimeout(tm);const j=await r.json();if(!j.rows)throw 0;
    mergeExp(j.rows);
    syncMsg='Shared with the family · synced '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});
    try{localStorage.setItem('expSynced',String(Date.now()))}catch(e){}
  }catch(e){syncMsg='Shared list not reachable right now. Your entries are saved on this phone and sync when there is internet.';}
  syncBusy=false;
  if(view==='spend'&&spMode==='trip'&&!expEdit&&!($('#ex-amt')&&$('#ex-amt').value)&&!($('#ex-what')&&$('#ex-what').value)&&!($('#ex-imp')&&$('#ex-imp').value))renderSpend();else syncStatus();
  if(syncAgain){syncAgain=false;syncExp();}
}
function mergeExp(rows){
  rows.forEach(r=>{
    const id=String(r.id||'');if(!id)return;const upd=+r.upd||+r.ts||0;
    if(String(r.del)==='1'){if(!EXPDT[id]){EXPDT[id]=upd||Date.now();EXPDEL.push(id);}EXP=EXP.filter(x=>x.id!==id);return;}
    if(EXPDT[id])return;
    const rec={id,date:String(r.date).slice(0,10),by:String(r.by),pay:r.pay==='Card'?'Card':'Cash',what:String(r.what||''),cat:String(r.cat||'Other'),amt:+r.amt||0,cur:ECUR[r.cur]?r.cur:'jpy',yen:+r.yen||0,ts:+r.ts||upd,upd};
    const x=EXP.find(e=>e.id===id);
    if(!x)EXP.push(rec);else if(upd>(x.upd||x.ts))Object.assign(x,rec);
  });
  storeExp();
}

  const today=japanDate(),last=[...EXP.map(x=>x.date),today<='2026-11-01'?today:'2026-11-01'].sort().pop();
  const byDay={};EXP.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+x.yen);
  const days=[];for(let d=new Date('2026-10-17T12:00:00Z');d.toISOString().slice(0,10)<=last;d.setUTCDate(d.getUTCDate()+1))days.push(d.toISOString().slice(0,10));
  const dl=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',timeZone:'UTC'});
  return `<section class="sec"><h2>Spent on the trip by type</h2>${barRows(cats)}</section>
  <section class="sec"><h2>Spent on the trip by day</h2>${barRows(days.map(d=>[dl(d),byDay[d]||0]),dl(today))}<p class="small">Only expenses added here, not bookings paid before the trip.</p></section>`;
}
const b64e=s=>btoa(Array.from(new TextEncoder().encode(s),c=>String.fromCharCode(c)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));
function expShareText(){
  const total=EXP.reduce((a,x)=>a+x.yen,0);
  const code=b64e(JSON.stringify(EXP.map(x=>[x.id,x.by,x.amt,x.cur,x.yen,x.what,x.cat,x.date,x.ts,x.pay||'Cash'])));
  return `Japan trip expenses: ${EXP.length} entries, ${yen(total)} in total.\nTo add them, open the Japan 2026 app, go to Spend and paste this whole message.\nJPX1.${code}.END`;
}
function expImport(txt){
  const m=/JPX1\.([A-Za-z0-9_-]+)\.END/.exec(txt.replace(/\s+/g,''));
  if(!m)return 'That doesn\'t look like a shared expense list. Paste the whole message.';
  let rows;try{rows=JSON.parse(b64d(m[1]));}catch(e){return 'The pasted list is incomplete. Copy the whole message again.';}
  const have=new Set(EXP.map(x=>x.id).concat(EXPDEL));let n=0;
  rows.forEach(r=>{if(!Array.isArray(r)||have.has(r[0]))return;const yv=+r[4];if(!(yv>=0))return;
    EXP.push({id:String(r[0]),by:String(r[1]),amt:+r[2],cur:ECUR[r[3]]?r[3]:'jpy',yen:yv,what:String(r[5]||''),cat:String(r[6]||'Other'),date:String(r[7]),ts:+r[8]||Date.now(),pay:r[9]==='Card'?'Card':'Cash'});have.add(r[0]);n++;});
  saveExp();return n?`Added ${n} new ${n===1?'entry':'entries'}.`:'Nothing new: you already had all of these.';
}
function expCSV(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Date','Paid by','Cash or card','What','Type','Amount','Currency','Yen']].concat([...EXP].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts).map(x=>[x.date,x.by,x.pay||'Cash',x.what,x.cat,x.amt,x.cur.toUpperCase(),Math.round(x.yen)]));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});
  const f=new File([blob],'japan-trip-expenses.csv',{type:'text/csv'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='japan-trip-expenses.csv';document.body.appendChild(a);a.click();a.remove();
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='expform')return;e.preventDefault();
  const msg=t=>{$('#exmsg').textContent=t;};
  const by=(document.querySelector('[data-expby][aria-pressed="true"]')||{}).dataset;
  const cat=(document.querySelector('[data-expcat][aria-pressed="true"]')||{}).dataset;
  const pay=(document.querySelector('[data-exppay][aria-pressed="true"]')||{}).dataset;
  const cur=$('#ex-cur').value, amt=parseFloat($('#ex-amt').value.replace(/[^\d.]/g,''));
  const date=$('#ex-date').value;
  if(!by||!by.expby)return msg('Tap who paid.');
  if(!(amt>0))return msg('Type the amount.');
  if(!date)return msg('Pick the date.');
  const y=cur==='jpy'?amt:amt*RATE[cur];
  const rec={by:by.expby,amt,cur,yen:Math.round(y),what:$('#ex-what').value.trim(),cat:cat?cat.expcat:'Other',pay:pay&&pay.exppay||'Cash',date};
  if(expEdit){const x=EXP.find(x=>x.id===expEdit);if(x)Object.assign(x,rec,{upd:Date.now()});expEdit=null;toast('Saved');}
  else{EXP.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),ts:Date.now(),upd:Date.now(),...rec});toast('Added '+yen(rec.yen));}
  expMe=rec.by;expCat=rec.cat;expPay=rec.pay;try{localStorage.setItem('expMe',expMe);localStorage.setItem('expPay',expPay)}catch(err){}
  saveExp();renderSpend();
});
document.addEventListener('click',e=>{
  if(view!=='spend')return;
  const sm=e.target.closest('[data-spmode]');if(sm){spMode=sm.dataset.spmode;renderSpend();return;}
  const p=e.target.closest('[data-expby],[data-expcat],[data-exppay]');
  if(p){const k=p.dataset.expby?'expby':p.dataset.expcat?'expcat':'exppay';document.querySelectorAll('[data-'+k+']').forEach(b=>b.setAttribute('aria-pressed',b===p));return;}
  const ed=e.target.closest('[data-expedit]');if(ed){expEdit=ed.dataset.expedit;expDelAsk=null;renderSpend();window.scrollTo(0,0);return;}
  if(e.target.closest('[data-expcancel]')){expEdit=null;renderSpend();return;}
  const dl=e.target.closest('[data-expdel]');if(dl){const id=dl.dataset.expdel;
    if(expDelAsk!==id){expDelAsk=id;dl.textContent='Tap again to delete';return;}
    EXP=EXP.filter(x=>x.id!==id);EXPDEL.push(id);EXPDT[id]=Date.now();expDelAsk=null;if(expEdit===id)expEdit=null;saveExp();renderSpend();toast('Deleted');return;}
  if(e.target.closest('[data-expshare]')){const t=expShareText();
    if(navigator.share)navigator.share({text:t}).catch(()=>{});
    else (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied. Paste it into a message.'),()=>{$('#ex-imp').value=t;toast('Copy the text in the box');});
    return;}
  if(e.target.closest('[data-expcsv]')){expCSV();return;}
  if(e.target.closest('[data-expimp]')){const r=expImport($('#ex-imp').value);if(r.startsWith('Added'))renderSpend();toast(r);return;}
});
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800);}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){cur=+go.dataset.go;view='day';render(true);return;}
  const tab=e.target.closest('[data-view]'); if(tab){view=tab.dataset.view;if(view==='tickets')tkSec=null;render(true);return;}
  if(e.target.closest('#vegtoggle')){vegOnly=!vegOnly;try{localStorage.setItem('vegOnly',vegOnly?'1':'0')}catch(err){};renderDay();return;}
  const tj=e.target.closest('[data-tkday]'); if(tj){tkFocus=tj.dataset.tkday;view='tickets';render(true);return;}
  if(e.target.closest('[data-ratelive]')){fetchRates(true);return;}
  const pk=e.target.closest('[data-pack]'); if(pk){openPack(pk.dataset.pack==='save');return;}
  const ts=e.target.closest('[data-tksec]'); if(ts){tkSec=ts.dataset.tksec||null;renderTickets();return;}
  if(e.target.closest('#tklock')){TK=null;try{localStorage.removeItem('tkpass')}catch(err){};renderTickets();return;}
  const qb=e.target.closest('[data-qr]'); if(qb&&TK){showQR(TK[+qb.dataset.qr]);return;}
  if(e.target.closest('[data-close]')){e.target.closest('.overlay').remove();return;}
  const cb=e.target.closest('[data-card]');if(cb){const c=CARDS[+cb.dataset.card];showCard(c[0],'',c[1],c[2]);return;}
  const hb=e.target.closest('[data-hotel]');if(hb){const h=STAYS[hb.dataset.hotel];showCard('このホテルまでお願いします。',h.jp+'\n'+h.name,'Please take us to this hotel. '+h.addr+' · Tel '+h.tel,'Kono hoteru made onegaishimasu.');return;}
  const cp=e.target.closest('[data-copy]'); if(cp){
    const txt=cp.dataset.copy;
    const msg=cp.dataset.copymsg||'Address copied. Show it to the driver.';
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(msg),()=>toast(txt));
  }
});

// start: hash deep-link (e.g. #oct24, #stays, #help), else today's Japan date, else first/last day
(function init(){
  const h=location.hash.slice(1);
  const hi=DAYS.findIndex(d=>key(d)===h);
  if(h==='stays'||h==='help'||h==='weather'||h==='tools'||h==='tickets'||h==='spend')view=h;
  if(hi>=0)cur=hi;
  else if(tIdx>=0)cur=tIdx;
  else cur=japanDate()>'2026-11-01'?DAYS.length-1:0;
  tick();setInterval(()=>{tick();refreshNextUp();if(view==='spend'&&SYNC&&!document.hidden)syncExp();},30000);
  fetchRates();window.addEventListener('online',()=>{fetchRates();syncExp();});document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchRates();if(view==='spend')syncExp();}});
  render(false);
})();
</script>
